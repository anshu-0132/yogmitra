# ─────────────────────────────────────────────────────────────────────────────
# config.yaml  –  Yoga Posture Correction System
#
# Edit freely; application reads this file at startup.
# All paths are relative to the project root unless marked absolute.
# ─────────────────────────────────────────────────────────────────────────────

# ── Saved model artifacts ─────────────────────────────────────────────────────
model:
  profile: zenodo               # "zenodo" (10-class dual-task) or "kaggle" (47-class)
  dir: saved_yoga_model_zenodo
  mediapipe_task: "pose_landmarker_heavy (1).task"

  # which classifier to use for inference: "rf" (Random Forest) or "mlp" (Neural Network)
  active_classifier: rf

# ── Practice / Guided Mode ────────────────────────────────────────────────────
practice:
  enabled: false                # pure auto-detect mode by default: matches poses from live video frames!
  target_pose: "Tadasana"       # optional reference fallback

# ── Biomechanical Anthropometric Calibration ──────────────────────────────────
calibration:
  auto_on_startup: true      # Prompt and run 5-second calibration on startup if uncalibrated
  duration_seconds: 5.0      # Duration of standing baseline capture

# ── Inference settings ────────────────────────────────────────────────────────
inference:
  # seconds between full pose-inference runs (0.3 / 0.5 / 1 / 2)
  interval_seconds: 0.5         # 0.5s for fast, responsive multi-step transitions

  # frames to accumulate for smoothing
  smoothing_window: 2

  # minimum probability to display a detected pose name
  confidence_threshold: 0.28

  # MediaPipe landmark visibility threshold
  visibility_threshold: 0.30

# ── Camera ────────────────────────────────────────────────────────────────────
camera:
  device_index: 0
  width: 1280
  height: 720
  mirror: true          # flip horizontally so it feels like a mirror

# ── Overlay / visual feedback ─────────────────────────────────────────────────
display:
  show_landmarks: true
  show_skeleton: true
  show_angles: true
  show_confidence: true
  font_scale: 0.65
  max_feedback_lines: 4   # max correction lines shown at once

# ── Voice feedback ────────────────────────────────────────────────────────────
voice:
  enabled: true
  rate: 155              # words per minute (pyttsx3)
  volume: 0.9
  # seconds to wait before repeating the same feedback message
  cooldown_seconds: 12
